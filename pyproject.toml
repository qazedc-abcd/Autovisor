[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autovisor"
dynamic = ["version"]
description = "智慧树课程自动化工具"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "httpx>=0.28,<1",
    "pillow>=10,<13",
    "playwright>=1.49,<2",
    "pygetwindow>=0.0.9; platform_system == 'Windows'",
    "requests>=2.31,<3",
]

[project.optional-dependencies]
captcha = [
    "numpy==1.26.4; python_version < '3.13'",
    "numpy==2.1.3; python_version >= '3.13'",
    "opencv-python==4.10.0.82; python_version < '3.13'",
    "opencv-python==4.10.0.84; python_version >= '3.13'",
]
gui = [
    "PySide6-Essentials>=6.8,<7",
]

[tool.uv]
package = false

[tool.setuptools.dynamic]
version = { attr = "modules.version.__version__" }

[tool.setuptools]
py-modules = []
